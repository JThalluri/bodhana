<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Constructs Workbench</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: system-ui, -apple-system, sans-serif;
  font-size: 14px;
  background: #f1f5f9;
  color: #1e293b;
  height: 100vh;
  overflow: hidden;
  display: flex;
}

/* ── Sidebar ──────────────────────────────────────────────────── */
#sidebar {
  width: 190px;
  flex-shrink: 0;
  background: #0f172a;
  color: #cbd5e1;
  display: flex;
  flex-direction: column;
  padding: 0;
  overflow-y: auto;
}

.wb-brand {
  padding: 16px 16px 12px;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: #64748b;
  border-bottom: 1px solid #1e293b;
  line-height: 1.5;
}

.io-pill {
  margin: 10px 12px;
  padding: 3px 8px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  display: inline-block;
}
.io-pill.fsa    { background: #052e16; color: #4ade80; }
.io-pill.upload { background: #1c1917; color: #fbbf24; }

.wb-step {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 9px 14px;
  border: none;
  background: none;
  color: #475569;
  text-align: left;
  cursor: default;
  font-family: inherit;
  font-size: 13px;
  transition: background 0.12s;
}
.wb-step.done   { color: #94a3b8; cursor: pointer; }
.wb-step.done:hover { background: #1e293b; }
.wb-step.active { color: #f8fafc; background: #1e293b; cursor: default; }
.wb-step.blocked .step-num { background: #ef4444 !important; color: #fff !important; }

.step-num {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: #1e293b;
  color: #475569;
  font-size: 11px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.wb-step.done   .step-num { background: #166534; color: #4ade80; }
.wb-step.active .step-num { background: #f97316; color: #fff; }
.step-lbl { font-size: 12px; line-height: 1.3; }

/* ── Main ─────────────────────────────────────────────────────── */
#main {
  flex: 1;
  overflow-y: auto;
  padding: 24px 28px;
}

h2 {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 16px;
  color: #1e293b;
}

h2 code {
  font-size: 15px;
  background: #f1f5f9;
  padding: 1px 6px;
  border-radius: 4px;
  border: 1px solid #e2e8f0;
}

/* ── Cards ────────────────────────────────────────────────────── */
.card {
  background: #fff;
  border: 1px solid #e2e8f0;
  border-radius: 8px;
  padding: 16px 20px;
  margin-bottom: 14px;
}

.card-title {
  font-size: 13px;
  font-weight: 700;
  color: #475569;
  margin-bottom: 10px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

/* ── Buttons ──────────────────────────────────────────────────── */
button, .btn-primary, .btn-secondary, .btn-danger {
  padding: 7px 14px;
  border-radius: 6px;
  border: 1px solid #e2e8f0;
  background: #fff;
  font-size: 13px;
  font-family: inherit;
  cursor: pointer;
  font-weight: 500;
  transition: background 0.1s, border-color 0.1s;
  line-height: 1.4;
}
button:hover { background: #f8fafc; }
button:disabled { opacity: 0.4; cursor: not-allowed; }

.btn-primary {
  background: #f97316;
  color: #fff;
  border-color: #f97316;
  font-weight: 600;
}
.btn-primary:hover:not(:disabled) { background: #ea580c; border-color: #ea580c; }

.btn-secondary { background: #fff; color: #374151; }
.btn-secondary:hover:not(:disabled) { background: #f3f4f6; }

.btn-danger {
  background: #ef4444;
  color: #fff;
  border-color: #ef4444;
  font-weight: 700;
  font-size: 14px;
}
.btn-danger:hover:not(:disabled) { background: #dc2626; }

.btn-primary.lg, .btn-danger.lg, .btn-secondary.lg {
  padding: 10px 20px;
  font-size: 14px;
  margin-top: 6px;
}
.btn-secondary.sm { font-size: 12px; padding: 4px 10px; }

/* ── Inputs ───────────────────────────────────────────────────── */
input[type=text], textarea {
  width: 100%;
  padding: 7px 10px;
  border: 1px solid #cbd5e1;
  border-radius: 6px;
  font-family: inherit;
  font-size: 13px;
  color: #1e293b;
  background: #fff;
  margin-top: 6px;
  margin-bottom: 8px;
}
input[type=text]:focus, textarea:focus {
  outline: none;
  border-color: #f97316;
  box-shadow: 0 0 0 3px #fed7aaaa;
}
textarea {
  font-family: 'Menlo', 'Consolas', 'Courier New', monospace;
  font-size: 12px;
  resize: vertical;
}
textarea[readonly] { background: #f8fafc; }

label {
  font-size: 12px;
  font-weight: 600;
  color: #475569;
  display: block;
}
label input[type=file] { margin-top: 6px; }

/* ── Tables ───────────────────────────────────────────────────── */
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  margin-top: 8px;
}
th {
  background: #f8fafc;
  text-align: left;
  padding: 6px 10px;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: #64748b;
  border-bottom: 2px solid #e2e8f0;
}
td {
  padding: 5px 10px;
  border-bottom: 1px solid #f1f5f9;
  vertical-align: middle;
}
tr:last-child td { border-bottom: none; }
tr:hover td { background: #fafafa; }

tr.unexpected td { background: #fef2f2; }
tr.diff-expected td { background: #f0fdf4; }
tr.now-passing td { background: #eff6ff; }

/* ── Status messages ──────────────────────────────────────────── */
.msg {
  padding: 8px 12px;
  border-radius: 6px;
  font-size: 13px;
  margin: 8px 0;
  line-height: 1.5;
}
.msg.ok   { color: #166534; background: #f0fdf4; border: 1px solid #bbf7d0; }
.msg.err  { color: #dc2626; background: #fef2f2; border: 1px solid #fecaca; }
.msg.info { color: #0369a1; background: #f0f9ff; border: 1px solid #bae6fd; }

/* ── Hard gate ────────────────────────────────────────────────── */
.hard-gate {
  background: #fef2f2;
  border: 2px solid #ef4444;
  border-radius: 8px;
  padding: 14px 16px;
  margin-bottom: 10px;
}
.hard-gate-title {
  color: #dc2626;
  font-weight: 700;
  font-size: 14px;
  margin-bottom: 8px;
}
.hard-gate ul { margin: 6px 0 0 16px; color: #b91c1c; }
.hard-gate p { color: #b91c1c; font-size: 13px; margin-top: 4px; }

/* ── Tier badges ──────────────────────────────────────────────── */
.tier-direct   { color: #f97316; font-weight: 700; font-size: 12px; }
.tier-suffix   { color: #7c3aed; font-weight: 700; font-size: 12px; }
.tier-compound { color: #0369a1; font-weight: 700; font-size: 12px; }
.tier-default  { color: #94a3b8; font-size: 12px; }

/* ── Diff colors ──────────────────────────────────────────────── */
.diff-old { color: #dc2626; }
.diff-new { color: #16a34a; font-weight: 600; }

/* ── Misc ─────────────────────────────────────────────────────── */
.hint { font-size: 12px; color: #64748b; margin: 4px 0 10px; line-height: 1.5; }
code { font-family: 'Menlo', 'Consolas', monospace; font-size: 12px; background: #f1f5f9; padding: 1px 5px; border-radius: 3px; }
.code-block { font-family: 'Menlo', 'Consolas', monospace; font-size: 12px; background: #1e293b; color: #e2e8f0; padding: 12px 14px; border-radius: 6px; line-height: 1.7; overflow-x: auto; }
.result-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; padding: 10px 14px; margin-bottom: 10px; }
.result-row { font-size: 13px; margin-bottom: 6px; }

/* ── Mode selector ────────────────────────────────────────────── */
.mode-selector { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
.mode-opt {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 14px;
  border: 1px solid #e2e8f0;
  border-radius: 6px;
  cursor: pointer;
  font-weight: normal;
  font-size: 13px;
  color: #1e293b;
  background: #fff;
  transition: border-color 0.12s, background 0.12s;
}
.mode-opt:hover { border-color: #f97316; background: #fff7ed; }
.mode-opt input[type=radio] { margin-top: 2px; flex-shrink: 0; accent-color: #f97316; }
.mode-opt span { line-height: 1.4; }
</style>
</head>

  <nav id="sidebar"></nav>
  <main id="main"></main>

// ── constructs-compile-core.mjs ──────────────────────────────────────────

/**
 * constructs-compile-core.mjs
 *
 * Pure YAML-object → compiled-JSON transform. Zero file I/O.
 * Exported as a named function so Phase 2's Constructs Workbench can import
 * and call it in-browser for sandbox-apply, without any Node built-in deps.
 *
 * Usage:
 *   import { compileConstructs } from './constructs-compile-core.mjs';
 *   const compiled = compileConstructs(parsedYamlObject, { sourceHash, generatedAt });
 */

/**
 * Normalise a raw parsed-YAML constructs object into the compiled JSON shape.
 *
 * @param {object} raw         - Result of js-yaml.load(yamlString)
 * @param {object} [meta]      - { sourceHash?: string, generatedAt?: string }
 * @returns {object}           - Compiled constructs object matching §4.2 shape
 */
function compileConstructs(raw, meta = {}) {
  // Validate schemaVersion presence (content validation is the validator's job;
  // this just ensures the field survives the transform).
  if (!raw.schemaVersion) {
    throw new Error('compileConstructs: raw object has no schemaVersion');
  }

  // Normalise suffixStripRules: fill in optional boolean fields with defaults
  const suffixStripRules = (raw.suffixStripRules || []).map(r => ({
    suffix:   String(r.suffix),
    minStem:  Number(r.minStem),
    always:   Boolean(r.always),
    undouble: Boolean(r.undouble || false),
    edOnly:   Boolean(r.edOnly || false),
  }));

  // Normalise vowelTeamExceptions: ensure note field is null when absent
  const vowelTeamExceptions = (raw.vowelTeamExceptions || []).map(row => ({
    word:    String(row.word),
    pattern: String(row.pattern),
    sound:   String(row.sound),
    note:    row.note != null ? String(row.note) : null,
  }));

  return {
    schemaVersion: String(raw.schemaVersion),
    generatedAt:   meta.generatedAt || new Date().toISOString(),
    sourceHash:    meta.sourceHash  || null,

    patternCategories:            deepCopy(raw.patternCategories),
    patternCategoryDefaultLevels: deepCopy(raw.patternCategoryDefaultLevels),
    patternLevelOverrides:        deepCopy(raw.patternLevelOverrides),
    scopeLevels:                  deepCopy(raw.scopeLevels),
    soundLabels:                  deepCopy(raw.soundLabels),
    defaultVowelSound:            deepCopy(raw.defaultVowelSound),

    vowelTeamExceptions,

    compoundParts:    [...(raw.compoundParts || [])].map(String),
    rootWords:        [...(raw.rootWords     || [])].map(String),
    suffixStripRules,
  };
}

function deepCopy(v) {
  if (v === null || v === undefined) return v;
  return JSON.parse(JSON.stringify(v));
}

/**
 * constructs-validate.mjs
 *
 * Pure validation functions for phonics-constructs.yaml. No file I/O.
 * Importable by both the CLI compiler and the Phase 2 Constructs Workbench.
 *
 * Each exported function throws a ValidationError on failure (listing ALL
 * specific violations, not just the first).
 */

class ValidationError extends Error {
  constructor(rule, violations) {
    super(`[${rule}] ${violations.length} violation(s):\n` +
      violations.map(v => `  - ${v}`).join('\n'));
    this.rule = rule;
    this.violations = violations;
  }
}

function fail(rule, violations) {
  throw new ValidationError(rule, violations);
}

  }
  const unreachable = [...declared].filter(p => !produced.has(p));
  if (unreachable.length) {
    fail('reachability', unreachable.map(p => `pattern "${p}" never appears as a token in any tokenizer fixture`));

/**
 * 5.2 No cross-category pattern collisions — no pattern string may appear in
 * more than one category.

function checkNoCrossCategoryCollisions(constructs) {
  const seen = new Map(); // pattern -> category
  const violations = [];
  for (const [cat, patterns] of Object.entries(constructs.patternCategories)) {
    for (const p of patterns) {
      if (seen.has(p)) {
        violations.push(`"${p}" declared in both "${seen.get(p)}" and "${cat}"`);
      } else {
        seen.set(p, cat);

/**

 * exercised by ≥1 syllableSplit fixture, and all three lookupException tiers
 * (direct, suffix-stripped, compound-scan) must be exercised by ≥1

 * version of lookupException's logic against the fixtures — this is validation

  const suffixesUsed = new Set();
  for (const f of fixtures.syllableSplit) {
    for (const r of constructs.suffixStripRules) {
      if (f.word.endsWith(r.suffix)) {
        suffixesUsed.add(r.suffix);

    .map(r => r.suffix)
    .filter(s => !suffixesUsed.has(s));

      `suffix "${s}" has no syllableSplit fixture ending with it`));

  // --- Three-tier lookup coverage ---
  // Build exception lookup map (word -> { pattern -> sound })
  const exceptByWord = {};
  for (const row of constructs.vowelTeamExceptions) {
    if (!exceptByWord[row.word]) exceptByWord[row.word] = {};
    exceptByWord[row.word][row.pattern] = row.sound;

  const suffixes = ['ing', 'est', 'ed', 'er', 'ly', 's', 'd', 'es'];
  let directHit = false;
  let suffixHit = false;
  let compoundHit = false;

  for (const f of fixtures.vowelTeamSounds) {
    const word = f.word;
    const pattern = f.pattern;

    // Tier 1: direct
    if (exceptByWord[word]?.[pattern]) {
      directHit = true;
      continue;
    }
    // Tier 2: suffix-stripped
    let strippedHit = false;
    for (const s of suffixes) {
      if (word.length > s.length + 2 && word.endsWith(s)) {
        const stem = word.slice(0, -s.length);
        if (exceptByWord[stem]?.[pattern]) {
          suffixHit = true;
          strippedHit = true;
          break;
        }
      }
    }
    if (strippedHit) continue;
    // Tier 3: compound-scan
    for (let j = 3; j <= word.length - 3; j++) {
      const prefix = word.slice(0, j);
      const suffix = word.slice(j);
      if (exceptByWord[prefix]?.[pattern] || exceptByWord[suffix]?.[pattern]) {
        compoundHit = true;
        break;
      }
    }
  }

  const tierViolations = [];
  if (!directHit)   tierViolations.push('direct-lookup tier never exercised by any vowelTeamSounds fixture');
  if (!suffixHit)   tierViolations.push('suffix-stripped tier never exercised by any vowelTeamSounds fixture');
  if (!compoundHit) tierViolations.push('compound-scan tier never exercised by any vowelTeamSounds fixture');
  if (tierViolations.length) fail('exception-tier-coverage', tierViolations);
}

/**
 * 5.4 Exception-table self-consistency — every row is verified against its
 * own stated output, and no (word, pattern) pair appears twice.
 */
function checkExceptionTableSelfConsistency(constructs) {
  const seenPairs = new Set();
  const violations = [];

  for (const row of constructs.vowelTeamExceptions) {
    const key = `${row.word}|${row.pattern}`;
    if (seenPairs.has(key)) {
      violations.push(`duplicate-exception-row: "${row.word}" + "${row.pattern}" appears more than once`);
    }
    seenPairs.add(key);

    if (!row.word.includes(row.pattern)) {
      violations.push(`exception-pattern-not-in-word: word "${row.word}" does not contain pattern "${row.pattern}"`);
    }
    if (!constructs.soundLabels[row.sound]) {
      violations.push(`exception-unknown-sound: "${row.sound}" in row for "${row.word}" has no soundLabels entry`);
    }
    if (!constructs.patternCategories.vowelTeams.includes(row.pattern)) {
      violations.push(`exception-pattern-not-a-vowel-team: "${row.pattern}" in row for "${row.word}" is not in patternCategories.vowelTeams`);
    }
  }

  if (violations.length) fail('exception-table-self-consistency', violations);
}

/**
 * 5.6 Grapheme integrity — for every tokenizer fixture, the graphemes field
 * must join back to the original word with no gaps or extra characters.
 * Invariant: graphemes.split('|').join('') === word
 */
function checkGraphemeIntegrity(fixtures) {
  const failures = [];
  for (const f of fixtures.tokenizer || []) {
    const joined = f.graphemes.split('|').join('');
    if (joined !== f.word) {
      failures.push(`${f.word}: graphemes "${f.graphemes}" joins to "${joined}", not "${f.word}"`);
    }
  }
  if (failures.length) {
    throw new ValidationError('grapheme-integrity', failures);
  }
}

/**
 * 5.5 Additional structural checks.
 */
function checkStructure(constructs) {
  const violations = [];
  const allPatterns = new Set(Object.values(constructs.patternCategories).flat());

  // patternLevelOverrides keys must exist in some patternCategories list
  for (const p of Object.keys(constructs.patternLevelOverrides)) {
    if (!allPatterns.has(p)) {
      violations.push(`patternLevelOverrides key "${p}" not found in any patternCategories list`);
    }
  }

  // defaultVowelSound keys must be in vowelTeams
  const vowelTeamSet = new Set(constructs.patternCategories.vowelTeams);
  for (const p of Object.keys(constructs.defaultVowelSound)) {
    if (!vowelTeamSet.has(p)) {
      violations.push(`defaultVowelSound key "${p}" is not in patternCategories.vowelTeams`);
    }
  }

  // Every sound referenced anywhere must have a soundLabels entry
  for (const sound of Object.values(constructs.defaultVowelSound)) {
    if (!constructs.soundLabels[sound]) {
      violations.push(`defaultVowelSound value "${sound}" has no soundLabels entry`);
    }
  }
  for (const row of constructs.vowelTeamExceptions) {
    if (!constructs.soundLabels[row.sound]) {
      violations.push(`vowelTeamExceptions sound "${row.sound}" (word: ${row.word}) has no soundLabels entry`);
    }
  }

  // compoundParts: length >= 2
  for (const w of constructs.compoundParts) {
    if (w.length < 2) {
      violations.push(`compoundParts entry "${w}" is shorter than 2 characters (hard-fail — do not silently drop)`);
    }
  }

  // rootWords: length >= 3
  for (const w of constructs.rootWords) {
    if (w.length < 3) {
      violations.push(`rootWords entry "${w}" is shorter than 3 characters (hard-fail — do not silently drop)`);
    }
  }

  // suffixStripRules: non-empty lowercase-alpha suffix, positive integer minStem
  for (const r of constructs.suffixStripRules) {
    if (!r.suffix || !/^[a-z]+$/.test(r.suffix)) {
      violations.push(`suffixStripRules entry has invalid suffix: "${r.suffix}"`);
    }
    if (!Number.isInteger(r.minStem) || r.minStem < 1) {
      violations.push(`suffixStripRules entry for "${r.suffix}" has invalid minStem: ${r.minStem}`);
    }
  }

  if (violations.length) fail('structural-checks', violations);
}

/**
 * Run all validation checks. Throws on the first failing check (but each
 * individual check reports ALL its violations before throwing).
 */
function validateAll(constructs, fixtures) {
  checkNoCrossCategoryCollisions(constructs);
  checkStructure(constructs);
  checkExceptionTableSelfConsistency(constructs);
  checkReachability(constructs, fixtures);
  checkSuffixAndExceptionBranchCoverage(constructs, fixtures);
  checkGraphemeIntegrity(fixtures);
}

 * Permanent, shared, production code. No global state.
 */

/**
 * Build a word-keyed exception lookup map from the flat vowelTeamExceptions array.
 * Shape: { [word]: { [pattern]: sound } }
 *
 * @param {Array<{ word: string, pattern: string, sound: string }>} vowelTeamExceptions
 * @returns {Object}
 */
function buildExceptionMap(vowelTeamExceptions) {
  const m = Object.create(null);
  for (const row of vowelTeamExceptions) {
    if (!m[row.word]) m[row.word] = Object.create(null);
    m[row.word][row.pattern] = row.sound;
  }
  return m;
}

/**
 * Three-tier exception lookup:
 *   1. Direct match (breathe)
 *   2. Suffix-stripped (breathes → breathe, believed → believe)
 *   3. Compound-scan (gingerbread → bread, overthrow → throw)

 * @param {string} word
 * @param {string} pattern
 * @param {Object} exceptionMap  - from buildExceptionMap
 * @returns {string | null}      - sound key, or null if no exception found
 */
function lookupException(word, pattern, exceptionMap) {
  // Tier 1: direct
  if (exceptionMap[word]?.[pattern]) return exceptionMap[word][pattern];

  // Tier 2: suffix-stripped
  const suffixes = ['ing', 'est', 'ed', 'er', 'ly', 's', 'd', 'es'];
  for (const s of suffixes) {
    if (word.length > s.length + 2 && word.endsWith(s)) {
      const stem = word.slice(0, -s.length);
      if (exceptionMap[stem]?.[pattern]) return exceptionMap[stem][pattern];
    }
  }

  // Tier 3: compound-scan
  for (let j = 3; j <= word.length - 3; j++) {
    const prefix = word.slice(0, j);
    if (exceptionMap[prefix]?.[pattern]) return exceptionMap[prefix][pattern];
    const suffix = word.slice(j);
    if (exceptionMap[suffix]?.[pattern]) return exceptionMap[suffix][pattern];
  }

  return null;
}

/**
 * Three-tier exception lookup returning both the matched sound and the tier.
 *
 * @param {string} word
 * @param {string} pattern
 * @param {Object} exceptionMap  - from buildExceptionMap
 * @returns {{ sound: string, tier: 'direct'|'suffix-stripped'|'compound-scan' } | null}

  if (exceptionMap[word]?.[pattern]) {
    return { sound: exceptionMap[word][pattern], tier: 'direct' };
  }

  // Tier 2: suffix-stripped
  const suffixes = ['ing', 'est', 'ed', 'er', 'ly', 's', 'd', 'es'];
  for (const s of suffixes) {
    if (word.length > s.length + 2 && word.endsWith(s)) {
      const stem = word.slice(0, -s.length);
      if (exceptionMap[stem]?.[pattern]) {
        return { sound: exceptionMap[stem][pattern], tier: 'suffix-stripped' };
      }
    }
  }

  // Tier 3: compound-scan
  for (let j = 3; j <= word.length - 3; j++) {
    const prefix = word.slice(0, j);
    if (exceptionMap[prefix]?.[pattern]) {
      return { sound: exceptionMap[prefix][pattern], tier: 'compound-scan' };
    }
    const suffix = word.slice(j);
    if (exceptionMap[suffix]?.[pattern]) {
      return { sound: exceptionMap[suffix][pattern], tier: 'compound-scan' };
    }
  }

  return null;

/**
 * Return the resolved sound key for a specific vowel-team pattern in a word,
 * using the same three-tier lookup as vowelTeamSounds.
 *
 * @param {string} word
 * @param {string} pattern
 * @param {Object} exceptionMap     - from buildExceptionMap
 * @param {Object} defaultVowelSound - { [pattern]: soundKey }
 * @returns {string|null}
 */
function soundForVowelTeam(word, pattern, exceptionMap, defaultVowelSound) {
  const ex = lookupException(word, pattern, exceptionMap);
  return ex ?? defaultVowelSound[pattern] ?? null;
}

/**
 * Return an array of { pattern, sound, label, is_default } for every vowel
 * team token found in the word.
 *
 * @param {string} word
 * @param {string[]} tokens           - from tokenize()
 * @param {Object}   exceptionMap     - from buildExceptionMap
 * @param {Object}   defaultVowelSound - { [pattern]: soundKey }
 * @param {Object}   soundLabels       - { [soundKey]: displayLabel }
 * @returns {Array<{ pattern: string, sound: string, label: string, is_default: boolean }>}
 */
function vowelTeamSounds(word, tokens, exceptionMap, defaultVowelSound, soundLabels) {
  const out = [];
  for (const t of tokens) {
    if (defaultVowelSound[t] === undefined) continue; // not a vowel team token
    const ex = lookupException(word, t, exceptionMap);
    const sound = ex ?? defaultVowelSound[t];
    if (!sound) continue;
    out.push({
      pattern:    t,
      sound,
      label:      soundLabels[sound] ?? sound,
      is_default: sound === defaultVowelSound[t],
    });
  }
  return out;
}

/**
 * tokenize.mjs — grapheme tokenizer
 *
 * Permanent, shared, production code. No global state — all lookup data is
 * passed explicitly as parameters so this module has zero side effects and
 * is safe to use in any environment.
 */

const CONSONANT_RE = /[bcdfghjklmnpqrstvwxyz]/;

function clean(word) {
  return String(word == null ? '' : word).toLowerCase().replace(/[^a-z]/g, '');
}

/**
 * Build the sorted patterns array from a patternCategories map.
 * Returns an array of { pattern, category }, longest-first.
 * Call once per compiled constructs load; pass result to tokenize().
 *
 * @param {Object} patternCategories - e.g. { digraphs: ['ch',...], blends: [...], ... }
 * @returns {{ pattern: string, category: string }[]}
 */
function buildSortedPatterns(patternCategories) {
  const seen = new Set();
  const patterns = [];
  for (const [cat, list] of Object.entries(patternCategories)) {
    for (const p of list) {
      if (!seen.has(p)) {
        seen.add(p);
        patterns.push({ pattern: p, category: cat });
      }
    }
  }
  return patterns.sort((a, b) => b.pattern.length - a.pattern.length);
}

/**
 * Tokenise a word into an array of grapheme strings.
 *
 * Rules:
 * - Greedy longest-match-first against sortedPatterns.
 * - 'ng' is only a digraph at the end of a syllable: when immediately followed
 *   by 'e', the n and g belong to different syllables (fin·ger, long·er, gin·ger)
 *   so the 'ng' match is skipped and they tokenise individually.
 * - Double consonants that match no pattern are merged (e.g. 'll', 'ss', 'ff')
 *   unless mergeDoubleConsonants:false is passed in opts.
 *
 * @param {string} word
 * @param {{ pattern: string, category: string }[]} sortedPatterns
 * @param {{ mergeDoubleConsonants?: boolean }} [opts]
 * @returns {string[]}
 */
function tokenize(word, sortedPatterns, opts = {}) {
  const mergeDoubles = opts.mergeDoubleConsonants !== false;
  const w = clean(word);
  const tokens = [];
  let i = 0;

  while (i < w.length) {
    let matched = null;

    for (const { pattern } of sortedPatterns) {
      if (pattern.length > w.length - i) continue;
      if (w.substr(i, pattern.length) !== pattern) continue;

      // 'ng' guard: skip when immediately followed by 'e' (gin·ger, fin·ger)
      if (pattern === 'ng' && i + 2 < w.length && w[i + 2] === 'e') continue;

      matched = pattern;
      break;
    }

    if (matched) {
      tokens.push(matched);
      i += matched.length;
      continue;
    }

    if (mergeDoubles &&
        i + 1 < w.length &&
        w[i] === w[i + 1] &&
        CONSONANT_RE.test(w[i])) {
      tokens.push(w[i] + w[i + 1]);
      i += 2;
      continue;
    }

    tokens.push(w[i]);
    i += 1;
  }

  return tokens;
}

/**
 * vowelNuclei.mjs — vowel nucleus identification for syllable splitting
 *
 * Permanent, shared, production code. No global state.
 */

const VOWEL_CHARS = new Set(['a', 'e', 'i', 'o', 'u']);

function clean(word) {
  return String(word == null ? '' : word).toLowerCase().replace(/[^a-z]/g, '');
}

function isVowelChar(ch) {
  return VOWEL_CHARS.has(ch);
}

/**
 * 'y' is a consonant only when it starts the word and is immediately followed
 * by a vowel (yes, you, yacht). Otherwise it acts as a vowel (happy, gym, fly).
 */
function isYVowel(w, i) {
  if (i === 0 && i + 1 < w.length && isVowelChar(w[i + 1])) return false;
  return true;
}

/**
 * Build the vowel nuclei list from compiled constructs.
 * Combines rControlled3 + specific trigraphs-as-nuclei + vowelTeams, deduped,
 * sorted longest-first.
 *
 * @param {Object} patternCategories
 * @returns {string[]}
 */
function buildVowelNucleiList(patternCategories) {
  // 'igh' acts as a vowel nucleus (night, fight) even though it is a trigraph
  const trigraphNuclei = ['igh'];
  const list = [
    ...patternCategories.rControlled3,
    ...patternCategories.vowelTeams.filter(p => p.length >= 3), // eigh, ough, augh first
    ...trigraphNuclei,
    ...patternCategories.vowelTeams.filter(p => p.length < 3),
  ];

  const seen = new Set();
  const deduped = [];
  for (const p of list) {
    if (!seen.has(p)) { seen.add(p); deduped.push(p); }
  }

}

 * Identify vowel nuclei in a word — positions and patterns used for syllable
 * boundary detection.
 *
 * A nucleus is a maximal vowel-team match (longest-first), a bare vowel char,
 * or 'y' acting as a vowel. Silent final 'e' is dropped when the word has 2+
 * nuclei and the 'e' is preceded by a consonant (or followed only by s/d).
 *
 * @param {string} word
 * @param {string[]} vowelNucleiList  - sorted longest-first (from buildVowelNucleiList)
 * @returns {{ start: number, end: number, pattern: string }[]}
 */
function identifyVowelNuclei(word, vowelNucleiList) {
  const w = clean(word);
  const nuclei = [];
  let i = 0;

  while (i < w.length) {
    // 'u' after 'q' is always consonantal — check before pattern matching so
    // that vowel-team patterns starting with 'u' (ue, ui) don't grab it.
    if (w[i] === 'u' && i > 0 && w[i - 1] === 'q') {
      i += 1;
      continue;
    }

    let matched = null;
    for (const p of vowelNucleiList) {
      if (w.substr(i, p.length) === p) {
        matched = p;
        break;
      }
    }
    if (matched) {
      nuclei.push({ start: i, end: i + matched.length, pattern: matched });
      i += matched.length;
      continue;
    }
    const ch = w[i];
    if (isVowelChar(ch) || (ch === 'y' && isYVowel(w, i))) {
      nuclei.push({ start: i, end: i + 1, pattern: ch });
      i += 1;
      continue;
    }
    i += 1;
  }

  // Drop silent final 'e' when the word has ≥2 nuclei and the 'e' is preceded
  // by a consonant. Applies to magic-e (flame, name) and inflected forms (cooked,
  // breathes). Words like maybe/steakhouse that should keep 'e' as a syllable
  // are handled earlier via compound-split before reaching this code.
  if (nuclei.length >= 2) {
    const last = nuclei[nuclei.length - 1];
    if (last.pattern === 'e' && last.start > 0 && !isVowelChar(w[last.start - 1])) {
      const after = w.slice(last.end);
      const isSilent = last.end === w.length ||
                       (after.length === 1 && (after === 's' || after === 'd'));
      if (isSilent) nuclei.pop();
    }
  }

  return nuclei;
}

}

/**
 * Split a word into syllables. Heuristic, compound/suffix-aware.
 *
 * @param {string} word
 * @param {SyllableCtx} ctx   - pre-built lookup structures (see below)
 * @param {number} [depth]    - recursion guard, start at 0
 * @returns {string[]}
 *
 * @typedef {{ vowelNucleiList: string[], compoundPartsSet: Set<string>,
 *             rootWordsSet: Set<string>, suffixStripRules: object[],
 *             patternCategoryMap: Map<string,string> }} SyllableCtx
 */
function splitSyllables(word, ctx, depth = 0) {
  const w = clean(word);
  if (!w) return [];
  if (depth > 4) return [w]; // runaway recursion guard

  // 1. Compound split: some|thing, rain|bow, any|one
  const compound = tryCompoundSplit(w, ctx.compoundPartsSet);
  if (compound) {
    return [
      ...splitSyllables(compound[0], ctx, depth + 1),
      ...splitSyllables(compound[1], ctx, depth + 1),
    ];
  }

  // 2. -Cle ending: ta|ble, lit|tle, ap|ple
  let stem = w;
  let cleSuffix = '';
  if (w.length > 4 && w.endsWith('le')) {
    const cIdx = w.length - 3;
    const c = w[cIdx];
    if (!isVowelChar(c) && c !== 'l') {
      cleSuffix = w.slice(cIdx);
      stem = w.slice(0, cIdx);
    }
  }

  // 3. Suffix strip: a|maz|ing, run|ning, teach|er
  const stripped = tryStripSuffix(stem, ctx.suffixStripRules, ctx.rootWordsSet);
  if (stripped && stripped.stem.length >= 2) {
    const stemSyls = splitSyllables(stripped.stem, ctx, depth + 1);
    const withSuffix = [...stemSyls, stripped.suffix];
    return cleSuffix ? [...withSuffix, cleSuffix] : withSuffix;
  }

  // 4. Pattern-based fallback
  const nuclei = identifyVowelNuclei(stem, ctx.vowelNucleiList);
  if (nuclei.length <= 1) {
    return cleSuffix ? [stem, cleSuffix] : [stem];
  }

  const boundaries = [];
  for (let n = 0; n < nuclei.length - 1; n++) {
    const cur = nuclei[n];
    const nxt = nuclei[n + 1];
    const between = stem.slice(cur.end, nxt.start);
    const len = between.length;
    let split;

    if (len === 0) {
      // Adjacent vowels → hiatus (cre·ate, play·er)
      split = cur.end;
    } else if (len === 1) {
      // VCV → split before the consonant (o·pen, ti·ger)
      split = cur.end;
      // Guard against bare-consonant syllable
      if (split < 1 || !/[aeiouy]/.test(stem.slice(0, split))) {
        split = cur.end + 1;
      }
    } else if (len === 2) {
      // VCCV: keep digraphs together (fa·ther), split other pairs (rab·bit)
      if (between === 'th' || between === 'sh' || between === 'ch' || between === 'wh') {
        split = cur.end;
      } else {
        split = cur.end + 1;
      }
    } else {
      // VCCCV+: keep last two together if they form a blend/digraph/cluster
      const lastTwo = between.slice(-2);
      const cat = ctx.patternCategoryMap.get(lastTwo);
      if (cat === 'blends' || cat === 'digraphs' || cat === 'clusters3') {
        split = nxt.start - 2;
      } else {
        split = nxt.start - 1;
      }
    }

    const prevBoundary = boundaries.length ? boundaries[boundaries.length - 1] : 0;
    if (split > prevBoundary) boundaries.push(split);
  }

  const syllables = [];
  let start = 0;
  for (const b of boundaries) {
    if (b > start) syllables.push(stem.slice(start, b));
    start = b;
  }
  if (start < stem.length) syllables.push(stem.slice(start));
  if (cleSuffix) syllables.push(cleSuffix);

  return syllables.length ? syllables : [w];
}

/**
 * Count syllables in a word using a fast vowel-nucleus heuristic.
 * This is independent of splitSyllables and does not require the full ctx.
 *
 * @param {string} word
 * @returns {number}
 */
function countSyllables(word) {
  const w = String(word == null ? '' : word).toLowerCase().replace(/[^a-z]/g, '');
  if (!w) return 0;
  if (w.length <= 3) return 1;
  let cleaned = w;
  if (cleaned.endsWith('e') && cleaned.length > 2) {
    const isLe = cleaned[cleaned.length - 2] === 'l' &&
                 cleaned.length > 3 &&
                 !isVowelChar(cleaned[cleaned.length - 3]);
    if (!isLe) cleaned = cleaned.slice(0, -1);
  }
  let count = 0;
  let prev = false;
  for (const ch of cleaned) {
    const v = isVowelChar(ch);
    if (v && !prev) count++;
    prev = v;
  }
  return Math.max(1, count);
}

/**
 * Compute onset (initial consonants) and rime (vowel + everything after).
 *
 * @param {string} word
 * @returns {{ onset: string, rime: string }}
 */
function onsetRime(word) {
  const w = String(word == null ? '' : word).toLowerCase().replace(/[^a-z]/g, '');
  let i = 0;
  while (i < w.length && !isVowelChar(w[i])) i++;
  return { onset: w.slice(0, i), rime: w.slice(i) };
}

/**
 * Find words in pool that are minimal pairs of word.
 * Two words are minimal pairs when they share the same rime (onset differs)
 * or the same onset (rime differs) — the classic onset–rime definition.
 *
 * @param {string} word
 * @param {string[]} pool
 * @returns {{ word: string, sharedOnset: boolean, sharedRime: boolean }[]}
 */
function findMinimalPairs(word, pool) {
  const target = clean(word);
  const { onset: targetOnset, rime: targetRime } = onsetRime(target);
  return pool
    .map(clean)
    .filter(w => w && w !== target)
    .filter(w => {
      const { onset, rime } = onsetRime(w);
      return onset === targetOnset || rime === targetRime;
    })
    .map(w => {
      const { onset, rime } = onsetRime(w);
      return { word: w, sharedOnset: onset === targetOnset, sharedRime: rime === targetRime };
    });
}

 * workbench-core.mjs — pure logic for the Constructs Workbench.
 *
 * Zero file I/O. All functions are stateless transforms on plain objects.
 * Importable by both the browser UI (app.js) and the Node.js test suite.

 * Depends on:
 *   ../../scripts/constructs-compile-core.mjs  — compileConstructs()
 *   ../../scripts/constructs-validate.mjs      — validateAll(), ValidationError
 *   ../../src/phonics/core/vowelSounds.mjs     — buildExceptionMap etc.
 *   ../../src/phonics/core/tokenize.mjs        — buildSortedPatterns, tokenize
 *   ../../src/phonics/core/syllables.mjs       — tryCompoundSplit, tryStripSuffix, splitSyllables etc.
 *   ../../src/phonics/core/vowelNuclei.mjs     — buildVowelNucleiList
 */





// ── Patch schema ─────────────────────────────────────────────────────────────

const ALLOWED_OPS = new Set(['add', 'modify', 'remove']);
const FORBIDDEN_KEYS = [
  'patternCategories', 'defaultVowelSound', 'compoundParts', 'rootWords',
  'suffixStripRules', 'patternCategoryDefaultLevels', 'patternLevelOverrides',
  'scopeLevels', 'soundLabels',
];

/**
 * Validate and normalise a raw patch object.
 *
 * Accepts `{ patch: { add?, modify?, remove? } }` (LLM output with wrapper)
 * or the bare `{ add?, modify?, remove? }` form.
 *
 * Throws with a specific message on any schema violation.
 *
 * @param {object} patchRaw
 * @returns {{ add?: Array, modify?: Array, remove?: Array }}
 */
function validatePatchSchema(patchRaw) {
  if (!patchRaw || typeof patchRaw !== 'object') {
    throw new Error('Patch must be a YAML object');
  }

  // Unwrap optional outer `patch:` wrapper key
  const keys = Object.keys(patchRaw);
  const patch = (keys.length === 1 && patchRaw.patch !== undefined)
    ? patchRaw.patch
    : patchRaw;

  if (!patch || typeof patch !== 'object' || Array.isArray(patch)) {
    throw new Error('Patch must be an object with "add", "modify", and/or "remove" keys');
  }

  for (const key of Object.keys(patch)) {
    if (FORBIDDEN_KEYS.includes(key)) {
      throw new Error(
        `Patch schema violation: key "${key}" is not allowed in Phase 1 patches — ` +
        `only "add", "modify", "remove" under "patch:" may target vowelTeamExceptions`
      );
    }
    if (!ALLOWED_OPS.has(key)) {
      throw new Error(
        `Patch schema violation: unknown key "${key}" — ` +
        `only "add", "modify", "remove" are valid patch operations`
      );
    }
  }

  for (const op of ['add', 'modify', 'remove']) {
    const items = patch[op];
    if (items === undefined) continue;
    if (!Array.isArray(items)) {
      throw new Error(`patch.${op} must be an array`);
    }
    for (let i = 0; i < items.length; i++) {
      const item = items[i];
      if (!item || typeof item !== 'object') {
        throw new Error(`patch.${op}[${i}] must be an object`);
      }
      if (!item.word || typeof item.word !== 'string') {
        throw new Error(`patch.${op}[${i}] must have a "word" string field`);
      }
      if (!item.pattern || typeof item.pattern !== 'string') {
        throw new Error(`patch.${op}[${i}] must have a "pattern" string field`);
      }
      if (op !== 'remove' && (!item.sound || typeof item.sound !== 'string')) {
        throw new Error(`patch.${op}[${i}] (word="${item.word}") must have a "sound" string field`);
      }
    }
  }

  return patch;
}

// ── Patch apply ───────────────────────────────────────────────────────────────

/**
 * Apply a validated patch to a raw parsed YAML constructs object.
 * Returns a deep-copied new object — never mutates rawObj.
 *
 * @param {object} rawObj  - result of jsyaml.load(constructsYamlText)
 * @param {object} patch   - normalised patch from validatePatchSchema()
 * @returns {object}
 */
function applyPatchToRaw(rawObj, patch) {
  const newRaw = JSON.parse(JSON.stringify(rawObj));
  const exceptions = newRaw.vowelTeamExceptions || [];

  for (const item of patch.remove || []) {
    const idx = exceptions.findIndex(r => r.word === item.word && r.pattern === item.pattern);
    if (idx >= 0) exceptions.splice(idx, 1);
  }

  for (const item of patch.modify || []) {
    const row = exceptions.find(r => r.word === item.word && r.pattern === item.pattern);
    if (!row) {
      throw new Error(`patch.modify: no existing row for word="${item.word}" pattern="${item.pattern}"`);
    }
    row.sound = item.sound;
    if (item.note !== undefined) row.note = item.note ?? null;
  }

  for (const item of patch.add || []) {
    exceptions.push({
      word:    String(item.word),
      pattern: String(item.pattern),
      sound:   String(item.sound),
      note:    item.note != null ? String(item.note) : null,
    });
  }

  newRaw.vowelTeamExceptions = exceptions;
  return newRaw;
}

// ── Blast radius ──────────────────────────────────────────────────────────────

/**
 * Find every word in the fixture corpus and exception table that contains
 * `pattern` as a substring, and compute each word's current resolved sound
 * and lookup tier against `compiledObj`.
 *
 * @param {string} pattern
 * @param {object} compiledObj
 * @param {object} fixturesObj  - { tokenizer, syllableSplit, vowelTeamSounds }
 * @returns {Array<{ word: string, sound: string|null, tier: string }>}
 */
function computeBlastRadius(pattern, compiledObj, fixturesObj) {
  const wordSet = new Set();

  for (const f of fixturesObj.vowelTeamSounds || []) {
    if (f.pattern === pattern) wordSet.add(String(f.word));
  }
  for (const row of compiledObj.vowelTeamExceptions || []) {
    if (row.pattern === pattern) wordSet.add(String(row.word));
  }
  for (const f of [
    ...(fixturesObj.vowelTeamSounds || []),
    ...(fixturesObj.syllableSplit   || []),
    ...(fixturesObj.tokenizer        || []),
  ]) {
    const word = f.word ? String(f.word) : null;
    if (word && word.includes(pattern)) wordSet.add(word);
  }

  const exMap        = buildExceptionMap(compiledObj.vowelTeamExceptions || []);
  const defaultSound = compiledObj.defaultVowelSound?.[pattern] ?? null;
  // Build sorted patterns once — required to verify the pattern is a genuine
  // tokenized vowel-team token in each word (not merely a substring match).
  // e.g. bear/beard contain 'ea' as a substring but tokenize as b|ear/b|ear|d;
  // 'ear' (r-controlled) wins at that position and 'ea' is never produced.
  const sortedPats = buildSortedPatterns(compiledObj.patternCategories || {});

  return [...wordSet]
    .filter(w => w.includes(pattern))
    .filter(w => tokenize(w, sortedPats).includes(pattern))
    .sort()
    .map(word => {
      const result = lookupExceptionWithTier(word, pattern, exMap);
      const sound  = result?.sound ?? defaultSound;
      const tier   = result?.tier  ?? (sound ? 'default' : null);
      return { word, sound, tier };
    });
}

// ── Regression diff ───────────────────────────────────────────────────────────

/**
 * Re-run every vowelTeamSounds fixture against two compiled objects and
 * return only the rows where the resolved sound changed.
 *
 * @param {object} oldCompiled
 * @param {object} newCompiled
 * @param {object} fixturesObj
 * @returns {Array<{ word, pattern, expected, oldSound, newSound }>}
 */
function runRegressionDiff(oldCompiled, newCompiled, fixturesObj) {
  const oldExMap   = buildExceptionMap(oldCompiled.vowelTeamExceptions || []);
  const newExMap   = buildExceptionMap(newCompiled.vowelTeamExceptions || []);
  const oldDefault = oldCompiled.defaultVowelSound || {};
  const newDefault = newCompiled.defaultVowelSound || {};

  const diffs = [];
  for (const f of fixturesObj.vowelTeamSounds || []) {
    const oldSound = soundForVowelTeam(f.word, f.pattern, oldExMap, oldDefault);
    const newSound = soundForVowelTeam(f.word, f.pattern, newExMap, newDefault);
    if (oldSound !== newSound) {
      // A known-failure fixture (expectedFailure: true) that now resolves to its documented
      // correct target is good news — surface it distinctly, do not block merge.
      const nowPassing = f.expectedFailure === true && newSound === String(f.sound);
      diffs.push({ word: String(f.word), pattern: String(f.pattern), expected: String(f.sound), oldSound, newSound, nowPassing });
    }
  }
  return diffs;
}

// ── CHANGELOG entry builder ───────────────────────────────────────────────────

/**
 * Build markdown table rows for the CHANGELOG, one per changed exception row.
 *
 * @param {object} patch       - normalised patch
 * @param {object} oldCompiled
 * @param {string} reason      - free-text reason from Step 4
 * @param {string} date        - ISO date (YYYY-MM-DD)
 * @returns {string[]}
 */
function buildChangelogEntries(patch, oldCompiled, reason, date) {
  const oldExMap   = buildExceptionMap(oldCompiled.vowelTeamExceptions || []);
  const oldDefault = oldCompiled.defaultVowelSound || {};
  const safeReason = (reason || '').replace(/\|/g, '/').trim() || '(no reason given)';

  const lines = [];
  for (const item of patch.add || []) {
    const old = soundForVowelTeam(item.word, item.pattern, oldExMap, oldDefault) ?? '(none)';
    lines.push(`| ${item.word} | ${old} | ${item.sound} | ${item.pattern} | ${date} | ${safeReason} |`);
  }
  for (const item of patch.modify || []) {
    const row = (oldCompiled.vowelTeamExceptions || []).find(r => r.word === item.word && r.pattern === item.pattern);
    const old = row?.sound ?? '(none)';
    lines.push(`| ${item.word} | ${old} | ${item.sound} | ${item.pattern} | ${date} | ${safeReason} |`);
  }
  for (const item of patch.remove || []) {
    const row = (oldCompiled.vowelTeamExceptions || []).find(r => r.word === item.word && r.pattern === item.pattern);
    const old = row?.sound ?? '(none)';
    lines.push(`| ${item.word} | ${old} | (removed) | ${item.pattern} | ${date} | ${safeReason} |`);
  }
  return lines;
}

// ── List mode — patch schema ──────────────────────────────────────────────────

const LIST_MODE_GLOBAL_FORBIDDEN = [
  'patternCategories', 'defaultVowelSound', 'suffixStripRules',
  'patternCategoryDefaultLevels', 'patternLevelOverrides',
  'scopeLevels', 'soundLabels', 'vowelTeamExceptions',
];

/**
 * Validate a patch for compoundPart or rootWord mode.
 *
 * Only "add" and "remove" are valid ops (no "modify").
 * Items must be plain strings — objects with word/pattern/sound are rejected immediately.
 * Mode-scoped: compoundPart patches may not touch rootWords, and vice versa.
 *
 * @param {object} patchRaw
 * @param {'compoundPart'|'rootWord'} mode
 * @returns {{ add?: string[], remove?: string[] }}
 */
function validatePatchSchemaForList(patchRaw, mode) {
  if (!patchRaw || typeof patchRaw !== 'object') {
    throw new Error('Patch must be a YAML object');
  }

  const keys = Object.keys(patchRaw);
  const patch = (keys.length === 1 && patchRaw.patch !== undefined)
    ? patchRaw.patch
    : patchRaw;

  if (!patch || typeof patch !== 'object' || Array.isArray(patch)) {
    throw new Error('Patch must be an object with "add" and/or "remove" keys');
  }

  const targetList = mode === 'compoundPart' ? 'compoundParts' : 'rootWords';
  const otherList  = mode === 'compoundPart' ? 'rootWords' : 'compoundParts';

  for (const key of Object.keys(patch)) {
    if (LIST_MODE_GLOBAL_FORBIDDEN.includes(key)) {
      throw new Error(
        `Patch schema violation: key "${key}" is not allowed — ` +
        `only "add"/"remove" targeting ${targetList} are valid in ${mode} mode`
      );
    }
    if (key === otherList) {
      throw new Error(
        `Patch schema violation: "${key}" is not allowed in ${mode} mode — ` +
        `this patch targets the wrong list`
      );
    }
    if (key === 'modify') {
      throw new Error(
        `Patch schema violation: "modify" is not valid in ${mode} mode — ` +
        `${targetList} is a flat string list, use "add"/"remove" only`
      );
    }
    if (key !== 'add' && key !== 'remove') {
      throw new Error(
        `Patch schema violation: unknown key "${key}" — ` +
        `only "add" and "remove" are valid in ${mode} mode`
      );
    }
  }

  for (const op of ['add', 'remove']) {
    const items = patch[op];
    if (items === undefined) continue;
    if (!Array.isArray(items)) {
      throw new Error(`patch.${op} must be an array`);
    }
    for (let i = 0; i < items.length; i++) {
      const item = items[i];
      if (item !== null && typeof item === 'object') {
        throw new Error(
          `patch.${op}[${i}] must be a string, not an object — ` +
          `${mode} mode patches are plain word entries, not word/pattern/sound rows`
        );
      }
      if (typeof item !== 'string' || !item.trim()) {
        throw new Error(`patch.${op}[${i}] must be a non-empty string`);
      }
    }
  }

  return patch;
}

// ── List mode — patch apply ───────────────────────────────────────────────────

/**
 * Apply a validated list-mode patch to a raw constructs object.
 * Returns a deep-copied new object — never mutates rawObj.
 *
 * @param {object} rawObj
 * @param {{ add?: string[], remove?: string[] }} patch
 * @param {'compoundPart'|'rootWord'} mode
 * @returns {object}
 */
function applyPatchToRawList(rawObj, patch, mode) {
  const newRaw = JSON.parse(JSON.stringify(rawObj));
  const listKey = mode === 'compoundPart' ? 'compoundParts' : 'rootWords';
  const list = [...(newRaw[listKey] || [])];

  for (const word of patch.remove || []) {
    const idx = list.indexOf(word);
    if (idx >= 0) list.splice(idx, 1);
  }

  for (const word of patch.add || []) {
    if (!list.includes(word)) list.push(word);
  }

  newRaw[listKey] = list;
  return newRaw;
}

// ── List mode — Step 2 analysis ───────────────────────────────────────────────

/**
 * Analyse a word for Compound Part mode (Step 2).
 *
 * Runs the real tryCompoundSplit against the word. If it already splits,
 * returns { alreadySplits: true, split }. If not, enumerates every candidate
 * split point the real algorithm's loop would consider and shows which halves
 * are already in compoundPartsSet.
 *
 * Each candidate includes wouldChange: whether enabling the compound path at
 * that boundary (by adding whichever halves are missing) would actually produce
 * a different syllable split from what pattern-fallback already gives today.
 * When wouldChange is false the addition is a no-op and the Target button
 * should not be shown.
 *
 * @param {string} word
 * @param {object} compiledObj
 * @returns {{ alreadySplits: boolean, split: string[]|null, currentSplit: string[], candidates?: Array }}
 */
function analyzeCompoundWord(word, compiledObj) {
  const w = word.toLowerCase().replace(/[^a-z]/g, '');
  const compoundPartsSet = buildCompoundPartsSet(compiledObj.compoundParts || []);
  const split = tryCompoundSplit(w, compoundPartsSet);
  const ctx = buildSyllableCtx(compiledObj);
  const currentSplit = splitSyllables(w, ctx);

  if (split) {
    return { alreadySplits: true, split, currentSplit };
  }

  const candidates = [];
  if (w.length >= 5) {
    for (let i = w.length - 2; i >= 3; i--) {
      const left  = w.slice(0, i);
      const right = w.slice(i);
      const leftInSet  = compoundPartsSet.has(left);
      const rightInSet = compoundPartsSet.has(right);

      // Simulate enabling the compound path at this boundary: add whichever
      // halves are missing, then re-run the full splitSyllables pipeline.
      const testSet = new Set([...compoundPartsSet, left, right]);
      const testCtx = { ...ctx, compoundPartsSet: testSet };
      const newSplit    = splitSyllables(w, testCtx);
      const wouldChange = JSON.stringify(newSplit) !== JSON.stringify(currentSplit);

      candidates.push({ left, right, leftInSet, rightInSet, wouldChange, newSplit });
    }
  }

  return { alreadySplits: false, split: null, currentSplit, candidates };
}

/**
 * Analyse a word for Root Word mode (Step 2).
 *
 * Runs the real tryStripSuffix against the word. Returns the match result,
 * the word's current split, and any candidates where undoubling was blocked
 * by a missing root entry.
 *
 * Each blocked candidate includes wouldChange: whether adding it to rootWords
 * would actually produce a different syllable split from what the algorithm
 * already gives today. When wouldChange is false the addition is a no-op.
 *
 * @param {string} word
 * @param {object} compiledObj
 * @returns {{ actualResult: object|null, currentSplit: string[], blockedCandidates: Array }}
 */
function analyzeRootWord(word, compiledObj) {
  const w = word.toLowerCase().replace(/[^a-z]/g, '');
  const rootWordsSet = buildRootWordsSet(compiledObj.rootWords || []);
  const rules = compiledObj.suffixStripRules || [];
  const ctx = buildSyllableCtx(compiledObj);
  const currentSplit = splitSyllables(w, ctx);

  const actualResult = tryStripSuffix(w, rules, rootWordsSet);

  const blockedCandidates = [];
  for (const r of rules) {
    if (w.length < r.suffix.length + r.minStem) continue;
    if (!w.endsWith(r.suffix)) continue;

    const stem = w.slice(0, -r.suffix.length);

    if (r.edOnly) {
      const lastCh = stem[stem.length - 1];
      if (lastCh !== 't' && lastCh !== 'd') continue;
    }

    if (!/[aeiouy]/.test(stem)) continue;

    if (r.undouble && stem.length >= 3) {
      const c1 = stem[stem.length - 1];
      const c2 = stem[stem.length - 2];
      if (c1 === c2 && !/[aeiou]/.test(c1) && c1 !== 'l' && c1 !== 's' && c1 !== 'f') {
        const candidate = stem.slice(0, -1);
        if (!rootWordsSet.has(candidate)) {
          const testSet  = new Set([...rootWordsSet, candidate]);
          const testCtx  = { ...ctx, rootWordsSet: testSet };
          const newSplit    = splitSyllables(w, testCtx);
          const wouldChange = JSON.stringify(newSplit) !== JSON.stringify(currentSplit);
          blockedCandidates.push({
            suffix: r.suffix,
            undoubledSuffix: c1 + r.suffix,
            candidate,
            wouldChange,
            newSplit,
          });
        }
      }
    }
  }

  return { actualResult, currentSplit, blockedCandidates };
}

// ── List mode — blast radius ──────────────────────────────────────────────────

function buildSyllableCtx(compiledObj) {
  return {
    vowelNucleiList:    buildVowelNucleiList(compiledObj.patternCategories || {}),
    compoundPartsSet:   buildCompoundPartsSet(compiledObj.compoundParts || []),
    rootWordsSet:       buildRootWordsSet(compiledObj.rootWords || []),
    suffixStripRules:   compiledObj.suffixStripRules || [],
    patternCategoryMap: buildPatternCategoryMap(compiledObj.patternCategories || {}),
  };
}

function listModeWordPool(fixturesObj) {
  const wordSet = new Set();
  for (const f of [
    ...(fixturesObj.vowelTeamSounds || []),
    ...(fixturesObj.syllableSplit   || []),
    ...(fixturesObj.tokenizer        || []),
  ]) {
    if (f.word) wordSet.add(String(f.word).toLowerCase().replace(/[^a-z]/g, ''));
  }
  return wordSet;
}

/**
 * Compute the blast radius for adding/removing a compoundParts candidate.
 *
 * Scans the full word pool for every word where the real tryCompoundSplit loop
 * would consider `candidate` as a valid half (respecting ≥3/≥2 char bounds).
 * For each match, computes current split and what split would be with candidate
 * toggled into the set.
 *
 * @param {string} candidate
 * @param {object} compiledObj
 * @param {object} fixturesObj
 * @returns {Array<{ word, currentSplit, newSplit, changes }>}
 */
function computeCompoundBlastRadius(candidate, compiledObj, fixturesObj) {
  const wordSet = listModeWordPool(fixturesObj);

  const affected = [...wordSet].filter(word => {
    if (word.length < 5) return false;
    for (let i = word.length - 2; i >= 3; i--) {
      if (word.slice(0, i) === candidate || word.slice(i) === candidate) return true;
    }
    return false;
  });

  const oldCtx = buildSyllableCtx(compiledObj);
  const newCompoundPartsSet = new Set([...oldCtx.compoundPartsSet, candidate]);
  const newCtx = { ...oldCtx, compoundPartsSet: newCompoundPartsSet };

  return affected.sort().map(word => {
    const currentSplit = splitSyllables(word, oldCtx);
    const newSplit     = splitSyllables(word, newCtx);
    const changes      = JSON.stringify(currentSplit) !== JSON.stringify(newSplit);
    return { word, currentSplit, newSplit, changes };
  });
}

/**
 * Compute the blast radius for adding/removing a rootWords candidate.
 *
 * Scans the full word pool for every word ending in any suffixStripRules suffix
 * whose stripped-and-undoubled stem equals the candidate.
 *
 * @param {string} candidate
 * @param {object} compiledObj
 * @param {object} fixturesObj
 * @returns {Array<{ word, currentSplit, newSplit, changes }>}
 */
function computeRootWordBlastRadius(candidate, compiledObj, fixturesObj) {
  const wordSet = listModeWordPool(fixturesObj);
  const rules   = compiledObj.suffixStripRules || [];

  const affected = [...wordSet].filter(word => {
    for (const r of rules) {
      if (word.length < r.suffix.length + r.minStem) continue;
      if (!word.endsWith(r.suffix)) continue;

      const stem = word.slice(0, -r.suffix.length);

      if (r.edOnly) {
        const lastCh = stem[stem.length - 1];
        if (lastCh !== 't' && lastCh !== 'd') continue;
      }

      if (!/[aeiouy]/.test(stem)) continue;

      if (r.undouble && stem.length >= 3) {
        const c1 = stem[stem.length - 1];
        const c2 = stem[stem.length - 2];
        if (c1 === c2 && !/[aeiou]/.test(c1) && c1 !== 'l' && c1 !== 's' && c1 !== 'f') {
          if (stem.slice(0, -1) === candidate) return true;
        }
      }

      if (stem === candidate) return true;
    }
    return false;
  });

  const oldCtx = buildSyllableCtx(compiledObj);
  const newRootWordsSet = new Set([...oldCtx.rootWordsSet, candidate]);
  const newCtx = { ...oldCtx, rootWordsSet: newRootWordsSet };

  return affected.sort().map(word => {
    const currentSplit = splitSyllables(word, oldCtx);
    const newSplit     = splitSyllables(word, newCtx);
    const changes      = JSON.stringify(currentSplit) !== JSON.stringify(newSplit);
    return { word, currentSplit, newSplit, changes };
  });
}

// ── Syllable regression diff ──────────────────────────────────────────────────

/**
 * Re-run every syllableSplit fixture against two compiled objects and return
 * rows where the resulting split array differs.
 *
 * Sibling to runRegressionDiff; reuses the same nowPassing/expectedFailure
 * logic — a syllableSplit fixture with expectedFailure: true that now matches
 * its documented target split is marked nowPassing and excluded from the
 * merge-blocking set.
 *
 * @param {object} oldCompiled
 * @param {object} newCompiled
 * @param {object} fixturesObj
 * @returns {Array<{ word, target, oldSplit, newSplit, nowPassing }>}
 */
function runSyllableRegressionDiff(oldCompiled, newCompiled, fixturesObj) {
  const oldCtx = buildSyllableCtx(oldCompiled);
  const newCtx = buildSyllableCtx(newCompiled);

  const diffs = [];
  for (const f of fixturesObj.syllableSplit || []) {
    const word     = String(f.word);
    const oldSplit = splitSyllables(word, oldCtx);
    const newSplit = splitSyllables(word, newCtx);
    if (JSON.stringify(oldSplit) !== JSON.stringify(newSplit)) {
      const target     = f.split;
      const nowPassing = f.expectedFailure === true &&
                         JSON.stringify(newSplit) === JSON.stringify(target);
      diffs.push({ word, target, oldSplit, newSplit, nowPassing });
    }
  }
  return diffs;
}

// ── List mode — CHANGELOG entry builder ──────────────────────────────────────

/**
 * Build markdown table rows for the CHANGELOG in list mode.
 * Format: | word | list | action | date | reason |
 *
 * @param {{ add?: string[], remove?: string[] }} patch
 * @param {'compoundPart'|'rootWord'} mode
 * @param {string} reason
 * @param {string} date  - ISO date (YYYY-MM-DD)
 * @returns {string[]}
 */
function buildChangelogEntriesForList(patch, mode, reason, date) {
  const listName   = mode === 'compoundPart' ? 'compoundParts' : 'rootWords';
  const safeReason = (reason || '').replace(/\|/g, '/').trim() || '(no reason given)';
  const lines = [];
  for (const word of patch.add || []) {
    lines.push(`| ${word} | ${listName} | added | ${date} | ${safeReason} |`);
  }
  for (const word of patch.remove || []) {
    lines.push(`| ${word} | ${listName} | removed | ${date} | ${safeReason} |`);
  }
  return lines;
}

    </div>
    ${STEPS.map(s => {
      const isDone    = s.num < S.step;
      const isActive  = s.num === S.step;

      const cls = isBlocked ? 'blocked' : isDone ? 'done' : isActive ? 'active' : '';

function goTo(n) { S.step = n; render(); }
function next()  { S.step = Math.min(8, S.step + 1); render(); }

// ── Shared templates ──────────────────────────────────────────────────────────

function card(title, body) {
  return `<div class="card"><div class="card-title">${title}</div>${body}</div>`;
}

function ok(msg)   { return `<p class="msg ok">${msg}</p>`; }
function err(msg)  { return `<p class="msg err">${msg}</p>`; }
function info(msg) { return `<p class="msg info">${msg}</p>`; }

function tierBadge(tier) {
  const cls = { direct: 'tier-direct', 'suffix-stripped': 'tier-suffix', 'compound-scan': 'tier-compound', default: 'tier-default' }[tier] || '';
  return `<span class="${cls}">${tier ?? '—'}</span>`;
}

// ── Step 1: Load Files ────────────────────────────────────────────────────────

function renderStep1() {
  const constructs = S.constructsText
    ? ok(`constructs loaded — ${(S.rawObj.vowelTeamExceptions||[]).length} exception rows, ${(S.rawObj.compoundParts||[]).length} compoundParts, ${(S.rawObj.rootWords||[]).length} rootWords`)
    : '';
  const fixtures = S.fixturesText
    ? ok(`fixtures loaded — ${(S.fixturesObj.vowelTeamSounds||[]).length} vowelTeamSounds, ${(S.fixturesObj.syllableSplit||[]).length} syllableSplit entries`)
    : '';
  const canProceed = S.compiledObj !== null;

  const modeSelector = canProceed ? `
    ${card('What do you want to fix?', `
      <div class="mode-selector">

        </label>
        <label class="mode-opt">
          <input type="radio" name="mode" value="rootWord" ${S.mode === 'rootWord' ? 'checked' : ''}>

    <h2>Step 1 — Load Files</h2>

    ${modeSelector}

    }
  `;
}

function wireStep1() {
  if (hasFSA) {
    document.getElementById('btnLoadConstructs')?.addEventListener('click', loadConstructsFSA);
    document.getElementById('btnLoadFixtures')?.addEventListener('click', loadFixturesFSA);
  } else {
    document.getElementById('fileConstructs')?.addEventListener('change', e => loadFileUpload(e, 'constructs'));
    document.getElementById('fileFixtures')?.addEventListener('change', e => loadFileUpload(e, 'fixtures'));
  }
  document.querySelectorAll('input[name="mode"]').forEach(radio => {
    radio.addEventListener('change', e => { S.mode = e.target.value; });
  });
  document.getElementById('btnStep1Next')?.addEventListener('click', () => next());
}

async function loadConstructsFSA() {
  try {
    const [handle] = await window.showOpenFilePicker({
      types: [{ description: 'YAML', accept: { 'text/yaml': ['.yaml', '.yml'] } }],
    });
    S.constructsHandle = handle;
    S.constructsText = await (await handle.getFile()).text();
    S.rawObj = jsyaml.load(S.constructsText);
    S.compiledObj = compileConstructs(S.rawObj);
    render();
  } catch (e) {
    if (e.name !== 'AbortError') alert(`Error loading constructs: ${e.message}`);
  }
}

async function loadFixturesFSA() {
  try {
    const [handle] = await window.showOpenFilePicker({
      types: [{ description: 'YAML', accept: { 'text/yaml': ['.yaml', '.yml'] } }],
    });
    S.fixturesHandle = handle;
    S.fixturesText = await (await handle.getFile()).text();
    S.fixturesObj = jsyaml.load(S.fixturesText);
    render();
  } catch (e) {
    if (e.name !== 'AbortError') alert(`Error loading fixtures: ${e.message}`);
  }
}

function loadFileUpload(event, which) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const text = e.target.result;
    try {
      if (which === 'constructs') {
        S.constructsText = text;
        S.rawObj = jsyaml.load(text);
        S.compiledObj = compileConstructs(S.rawObj);
      } else {
        S.fixturesText = text;
        S.fixturesObj = jsyaml.load(text);
      }
      render();
    } catch (err) {
      alert(`Parse error: ${err.message}`);
    }
  };
  reader.readAsText(file);
}

// Step 2 — Vowel Sound mode (unchanged) ────────────────────────────────────────

function renderStep2VowelSound() {
  const defaults    = S.compiledObj?.defaultVowelSound ?? {};
  const exMap       = buildExceptionMap(S.compiledObj?.vowelTeamExceptions ?? []);
  const q           = S.query.trim().toLowerCase();
  const isPattern   = !!defaults[q];
  let resultHtml    = '';

  if (q.length > 0) {
    if (isPattern) {
      const rows = (S.compiledObj.vowelTeamExceptions || []).filter(r => r.pattern === q);
      resultHtml = `
        <div class="result-box">
          <div class="result-row"><strong>Pattern:</strong> <code>${q}</code></div>
          <div class="result-row"><strong>Default sound:</strong> <code>${defaults[q] ?? '(none)'}</code></div>
          <div class="result-row"><strong>Exception rows (${rows.length}):</strong></div>
          ${rows.length > 0
            ? `<table><thead><tr><th>word</th><th>sound</th><th>note</th></tr></thead><tbody>
               ${rows.map(r => `<tr><td>${r.word}</td><td><code>${r.sound}</code></td><td>${r.note ?? ''}</td></tr>`).join('')}
               </tbody></table>`
            : `<p class="hint">No exception rows.</p>`
          }
        </div>
        <button class="btn-primary" id="btnTarget">Target pattern "${q}" →</button>
      `;
    } else if (q.length >= 2) {
      const patternsSorted = Object.keys(defaults).sort((a, b) => b.length - a.length);
      const found = patternsSorted.filter(p => q.includes(p));
      if (found.length === 0) {
        resultHtml = `<p class="hint">No vowel team patterns detected in "${q}".</p>`;
      } else {
        const rows = found.map(p => {
          const res = lookupExceptionWithTier(q, p, exMap);
          const sound = res?.sound ?? defaults[p] ?? null;
          const tier  = res?.tier  ?? 'default';
          return { pattern: p, sound, tier };
        });
        resultHtml = `
          <div class="result-box">
            <div class="result-row"><strong>Word:</strong> <code>${q}</code></div>
            <table><thead><tr><th>pattern</th><th>current sound</th><th>tier</th></tr></thead><tbody>
              ${rows.map(r => `<tr>
                <td><code>${r.pattern}</code></td>
                <td><code>${r.sound ?? '—'}</code></td>
                <td>${tierBadge(r.tier)}</td>
              </tr>`).join('')}
            </tbody></table>
          </div>
          ${rows.map(r => `<button class="btn-primary" data-pat="${r.pattern}" id="btnTarget_${r.pattern}">
            Target pattern "${r.pattern}" for "${q}" →
          </button>`).join('')}
        `;
      }
    }
  }

  return `
    <h2>Step 2 — Target a Word or Pattern</h2>
    ${card('Search', `
      <label for="qInput">Enter a word (e.g. <code>speak</code>) or a vowel-team pattern (e.g. <code>ea</code>):</label>
      <input type="text" id="qInput" placeholder="speak  or  ea" value="${S.query}" autocomplete="off" spellcheck="false">
    `)}
    ${resultHtml ? card('Result', resultHtml) : ''}
  `;
}

function wireStep2VowelSound() {
  const inp = document.getElementById('qInput');
  let debounceTimer;
  inp?.addEventListener('input', e => {
    S.query = e.target.value;
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => render(), 500);
  });

  document.querySelectorAll('[id^="btnTarget"]').forEach(btn => {
