patch:
  add:
    - word: recreation
      pattern: ea
      sound: hiatus
      note: Separate /i/ and /eɪ/ nuclei.
    - word: buried
      pattern: ie
      sound: long_e
      note: Unstressed final /i/ in bury + ed; not /aɪ/.
    - word: worried
      pattern: ie
      sound: long_e
      note: Unstressed final /i/ in worry + ed; not /aɪ/.
    - word: buries
      pattern: ie
      sound: long_e
      note: Bury + s retains unstressed /i/.
    - word: worries
      pattern: ie
      sound: long_e
      note: Worry + s retains unstressed /i/.
    - word: enough
      pattern: ough
      sound: short_u
      note: The active token is ough; ou was shadowed.
    - word: rough
      pattern: ough
      sound: short_u
      note: The active token is ough; ou was shadowed.
    - word: tough
      pattern: ough
      sound: short_u
      note: The active token is ough; ou was shadowed.
    - word: laugh
      pattern: augh
      sound: short_a
      note: US /æ/; UK broad /ɑː/. Inherited by laughed/laughter; not caught.
    - word: thought
      pattern: ough
      sound: aw
      note: Saw/THOUGHT vowel family, not the long-o of though.
    - word: beauty
      pattern: eau
      sound: long_u
      note: /juː/ in the beauty family, unlike beau/bureau/plateau.
    - word: beautiful
      pattern: eau
      sound: long_u
      note: /juː/ in the beauty family, unlike beau/bureau/plateau.
    - word: beautify
      pattern: eau
      sound: long_u
      note: /juː/ in the beauty family, unlike beau/bureau/plateau.
    - word: beautician
      pattern: eau
      sound: long_u
      note: /juː/ in the beauty family, unlike beau/bureau/plateau.
    - word: beautification
      pattern: eau
      sound: long_u
      note: /juː/ in the beauty family, unlike beau/bureau/plateau.
    - word: beauties
      pattern: eau
      sound: long_u
      note: /juː/ in the beauty family, unlike beau/bureau/plateau.
    - word: thorough
      pattern: ough
      sound: long_o
      note: US /oʊ/ final syllable; direct guard prevents false compound-scan inheritance from rough.
    - word: beauties
      pattern: ie
      sound: long_e
      note: Beauty + s retains unstressed /i/; not the /aɪ/ in ties.
    - word: beautified
      pattern: eau
      sound: long_u
      note: Beauty/beautify family retains long-u; y-changing forms need a direct exception.
    - word: beautifies
      pattern: eau
      sound: long_u
      note: Beauty/beautify family retains long-u; y-changing forms need a direct exception.
    - word: beauteous
      pattern: eau
      sound: long_u
      note: Beauty/beautify family retains long-u; y-changing forms need a direct exception.
    - word: beautified
      pattern: ie
      sound: long_i
      note: Beautify + ed/s retains long-i, unlike buried/worried.
    - word: beautifies
      pattern: ie
      sound: long_i
      note: Beautify + ed/s retains long-i, unlike buried/worried.
  remove:
    - word: enough
      pattern: ou
    - word: rough
      pattern: ou
    - word: tough
      pattern: ou
