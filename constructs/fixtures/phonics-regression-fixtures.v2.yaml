  - { word: cup, graphemes: "c|u|p" }

  # Digraphs
  - { word: math,  graphemes: "m|a|th" }
  - { word: whale, graphemes: "wh|a|l|e" }
  - { word: duck,  graphemes: "d|u|ck" }
