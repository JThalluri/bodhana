# Authoritative, machine-readable regression corpus for the Phase 1 build.
# Human-readable rationale lives in phonics-regression-fixtures-v2.md — read that first.
# This file is the thing tests actually load. Do not hand-edit without updating the .md too.
#
# expectedFailure: true means "this is the correct target, the implementation is known not to
# meet it yet, see phonics-phase2-backlog.md for the tracked reason." Tests for these should
# assert-and-report as a known-failure, not a hard build-blocking failure, and the harness should
# warn loudly if an expectedFailure case starts passing (so the backlog item can be closed) or if
# a non-expectedFailure case starts failing (a real regression).

schemaVersion: "1.0.0"

tokenizer:
  # format: { word, graphemes }  graphemes uses '|' as the phoneme separator, matching tokenize()
  - { word: ship,        graphemes: "sh|i|p" }
  - { word: catch,       graphemes: "c|a|tch" }
  - { word: stretch,     graphemes: "str|e|tch" }
  - { word: shell,       graphemes: "sh|e|ll" }
