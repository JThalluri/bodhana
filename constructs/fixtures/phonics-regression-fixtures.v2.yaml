  # Floss
  - { word: buzz,  graphemes: "b|u|zz" }
  - { word: cliff, graphemes: "cl|i|ff" }
  - { word: grass, graphemes: "gr|a|ss" }

  # Clusters3 and trigraphs
  - { word: splash, graphemes: "spl|a|sh" }
  - { word: sprint, graphemes: "spr|i|nt" }
  - { word: shrimp, graphemes: "shr|i|mp" }
  - { word: three,  graphemes: "thr|ee" }
