  - { word: longer,      graphemes: "l|o|n|g|er" }
  - { word: stronger,    graphemes: "str|o|n|g|er" }
  - { word: younger,     graphemes: "y|ou|n|g|er" }

  # CVC / Level 1 baseline
  - { word: cat, graphemes: "c|a|t" }
  - { word: dog, graphemes: "d|o|g" }
  - { word: sun, graphemes: "s|u|n" }
  - { word: hat, graphemes: "h|a|t" }
