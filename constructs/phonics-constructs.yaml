suffixStripRules:
  # ORDER MATTERS — first match wins, exactly as the runtime rules[] array.
  - { suffix: tion,  minStem: 2, always: true }
  - { suffix: sion,  minStem: 2, always: true }
  - { suffix: ment,  minStem: 3, always: true }
  - { suffix: ness,  minStem: 3, always: true }
  - { suffix: less,  minStem: 3, always: true }
  - { suffix: able,  minStem: 3, always: true }
  - { suffix: ible,  minStem: 3, always: true }
  - { suffix: ie,    minStem: 2, always: false }
  - { suffix: ous,   minStem: 3, always: false }
  - { suffix: ful,   minStem: 3, always: true }
  - { suffix: ing,   minStem: 3, always: true,  undouble: true }
  - { suffix: ly,    minStem: 3, always: true }
  - { suffix: est,   minStem: 4, always: true,  undouble: true }
  - { suffix: er,    minStem: 5, always: false, undouble: true }
  - { suffix: ed,    minStem: 2, always: true,  edOnly: true }
