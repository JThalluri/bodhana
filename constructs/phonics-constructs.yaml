schemaVersion: "1.0.0"

patternCategories:
  digraphs:    [ch, sh, th, wh, ph, ck, ng, qu, gh, kn, wr, gn, mb, ps]
  floss:       [ss, ff, ll, zz]
  blends:      [bl, cl, fl, gl, pl, sl, br, cr, dr, fr, gr, pr, tr,
                tw, dw, sc, sk, sm, sn, sp, st, sw,
                mp, nt, nk, nd, ft, lt, lk, ld, lp, lf, pt, ct, xt]
  # NOTE: rd, rk, rm, rn, rl, rt deliberately excluded — structurally unreachable.
  # rControlled always claims the vowel+r pair first (greedy longest-match).
  # See backlog "RESOLVED" section. Do not re-add without re-reading that entry.
  clusters3:   [scr, spl, spr, str, shr, thr, squ, sch]
  trigraphs:   [tch, dge, igh]
  vowelTeams:  [ai, ay, ea, ee, ie, oa, oe, ue, ui,
                au, aw, ei, eu, ew, ey, oi, oo, ou, ow, oy,
                eigh, ough, augh]
  rControlled:  [ar, er, ir, or, ur]
  rControlled3: [air, ear, eer, oor, our, are, ere, ire, ore, ure, oar]

patternCategoryDefaultLevels:
  digraphs: 2
  floss: 2
  blends: 3
  clusters3: 4
  trigraphs: 4
  vowelTeams: 5
  rControlled: 6
  rControlled3: 7

patternLevelOverrides:
  gh: 4
  kn: 4
  wr: 4
  gn: 4
  mb: 4
  ps: 4
  au: 6
  aw: 6
  ei: 6
  eu: 6
  ew: 6
  ey: 6
  oi: 6
  oo: 6
  ou: 6
  ow: 6
  oy: 6
  eigh: 8
  ough: 8
  augh: 8

scopeLevels:
  - { level: 1, name: "CVC & single letters",      desc: "cat, dog, sun" }
  - { level: 2, name: "Digraphs & FLOSS",           desc: "sh, ch, th, ck, ng, ss, ll" }
  - { level: 3, name: "Consonant blends",           desc: "st, tr, bl, mp, nd" }
  - { level: 4, name: "Trigraphs & 3-clusters",     desc: "tch, dge, igh, str, spl" }
  - { level: 5, name: "Common vowel teams",         desc: "ai, ay, ee, ea, oa" }
  - { level: 6, name: "Advanced vowels & R-ctrl",   desc: "oi, oy, ou, au, ar, er" }
  - { level: 7, name: "R-ctrl trigraphs",           desc: "air, ear, ire, ore" }
  - { level: 8, name: "Advanced / multi-syllable",  desc: "ough, eigh, schwa" }

soundLabels:
  long_a:   "/ā/ (cake)"
  long_e:   "/ē/ (see)"
  long_i:   "/ī/ (bike)"
  long_o:   "/ō/ (boat)"
  long_u:   "/ū/ (cube)"
  short_a:  "/ă/ (cat)"
  short_e:  "/ĕ/ (bed)"
  short_i:  "/ĭ/ (bit)"
  short_o:  "/ŏ/ (dog)"
  short_u:  "/ŭ/ (cup)"
  oo_long:  "/o͞o/ (moon)"
  oo_short: "/o͝o/ (book)"
  ow:       "/ou/ (cow)"
  oi:       "/oi/ (coin)"
  aw:       "/ô/ (saw)"
  air:      "/âr/ (air)"

defaultVowelSound:
  ai: long_a
  ay: long_a
  ea: long_e
  ee: long_e
  ie: long_i
  oa: long_o
  oe: long_o
  ue: long_u
  ui: long_u
  au: aw
  aw: aw
  ei: long_a
  eu: long_u
  ew: oo_long
  ey: long_a
  oi: oi
  oy: oi
  oo: oo_long
  ou: ow
  ow: ow
  eigh: long_a
  augh: aw
  ough: long_o

# Flat array of exception rows. Each row: { word, pattern, sound, note? }
# Two rows for the same word is NORMAL (dual-override words like cookie).
# Duplicate (word, pattern) pairs are the hard-fail condition (different sounds
# for the same word+pattern is a real contradiction). See README.md §Exception table.
vowelTeamExceptions:
  # ---- ea = short_e ----
  - { word: bread,     pattern: ea, sound: short_e }
  - { word: head,      pattern: ea, sound: short_e }
